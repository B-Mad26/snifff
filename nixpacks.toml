[phases.setup]
nixPkgs = ["nodejs_22", "openssl"]

[phases.install]
cmds = ["corepack enable && corepack prepare pnpm@11.1.3 --activate && pnpm install --frozen-lockfile"]

[phases.build]
cmds = [
  "pnpm --filter @snifff/api prisma:generate",
  "pnpm --filter @snifff/api build"
]

[start]
cmd = "pnpm --filter @snifff/api prisma:migrate:deploy && node apps/api/dist/main.js"
