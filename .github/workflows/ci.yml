name: CI

on:
  push:    { branches: [main, develop] }
  pull_request: { branches: [main, develop] }

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: snifff, POSTGRES_PASSWORD: snifff, POSTGRES_DB: snifff_test }
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U snifff" --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://snifff:snifff@localhost:5432/snifff_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access
      JWT_REFRESH_SECRET: ci-refresh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @snifff/api prisma:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
